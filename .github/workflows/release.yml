name: Build Static Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build'
        default: '8.3'

permissions:
  contents: write

jobs:
  # bin/qbixserver.phar is committed and is what a Composer install runs, but
  # nothing rebuilds it -- three releases in a row shipped a phar older than
  # the source beside it. The phar workflow keeps it current on the branch;
  # this refuses to cut a release if a tag was made before that landed.
  phar-is-current:
    name: phar matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0
          coverage: none

      - name: Check
        run: php tests/phar-is-current.php

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            spc_os: linux
            spc_arch: x86_64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd,dom,xml,simplexml,xmlwriter,xmlreader,iconv,intl,xsl,mysqli,mysqlnd,curl,bcmath,exif"
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            spc_os: linux
            spc_arch: aarch64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd,dom,xml,simplexml,xmlwriter,xmlreader,iconv,intl,xsl,mysqli,mysqlnd,curl,bcmath,exif"
          - os: macos-latest
            name: macos-arm64
            spc_os: macos
            spc_arch: aarch64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd,dom,xml,simplexml,xmlwriter,xmlreader,iconv,intl,xsl,mysqli,mysqlnd,curl,bcmath,exif"
          - os: windows-latest
            name: windows-x64
            # Fails at the moment: the static PHP build cannot fetch icu. It
            # must not block the platforms that work while that is true, and
            # with the step-level continue-on-error removed above it would.
            experimental: true
            spc_os: windows
            spc_arch: x64
            # No pcntl or posix on Windows, and no xsl: spc says plainly
            # "library [libxslt] is in the lib.json list but not supported to
            # compile" there. Asking for it stopped the build after every
            # dependency had been fetched and the toolchain configured, which
            # is why this looked like a compiler problem for so long.
            extensions: "sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,session,gd,dom,xml,simplexml,xmlwriter,xmlreader,iconv,intl,mysqli,mysqlnd,curl,bcmath,exif"

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}
    # A leg marked experimental may fail without holding the others back.
    # macOS is no longer one: it builds and passes its tests. Windows still
    # cannot fetch icu, and that should be visible rather than blocking.
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      # ── Unix build dependencies ──────────────────────────
      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake autoconf automake libtool \
            pkg-config pkgconf bison re2c curl wget \
            musl-tools musl-dev

      - name: Install system build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake autoconf automake libtool pkg-config bison re2c

      # ── Download spc binary ──────────────────────────────
      - name: Download spc (Unix)
        if: runner.os != 'Windows'
        run: |
          SPC_URL="https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}"
          echo "Downloading: $SPC_URL"
          for i in 1 2 3; do
            curl -fSL --retry 3 --retry-delay 5 "$SPC_URL" -o spc && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ ! -f spc ]; then
            echo "Self-hosted download failed, trying GitHub release..."
            curl -fSL "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}" -o spc
          fi
          chmod +x spc
          ./spc --version

      - name: Setup spc from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The nightly spc binary has Windows extraction bugs, so this runs
          # spc from source with the runner's PHP instead.
          #
          # Pinned to a release rather than tracking the default branch. It was
          # unpinned, which meant the Windows build inherited whatever was in
          # upstream's tip on the day -- and upstream's last release is four
          # months behind that tip, so the one platform built from source was
          # also the only one built from code nobody had cut a version of. The
          # symptom was PHP's own configure appearing to succeed and `nmake
          # clean` then failing in two seconds, while every other package built
          # normally.
          #
          # Raising this is a deliberate step: check the platform still builds
          # before moving it.
          # One line on purpose. This step runs under PowerShell, where the
          # line continuation is a backtick and a backslash is just an
          # argument -- so a wrapped command here clones "\" and then tries to
          # run the URL as a program.
          git clone --depth 1 --branch 2.8.5 https://github.com/crazywhalecc/static-php-cli.git spc-src
          cd spc-src
          php -v
          composer install --no-dev --no-interaction --quiet 2>&1
          php bin/spc --version

      # ── Unix-only setup steps ────────────────────────────
      - name: Make pkg-config findable everywhere
        if: runner.os != 'Windows'
        run: |
          PKG_REAL=""
          for p in /usr/bin/pkg-config /opt/homebrew/bin/pkg-config /usr/local/bin/pkg-config; do
            if [ -x "$p" ]; then PKG_REAL="$p"; break; fi
          done
          if [ -z "$PKG_REAL" ] && command -v pkgconf &>/dev/null; then
            PKG_REAL="$(which pkgconf)"
          fi
          if [ -n "$PKG_REAL" ]; then
            echo "Found pkg-config at: $PKG_REAL"
            for dest in /usr/local/bin /usr/local/musl/bin /usr/bin; do
              sudo mkdir -p "$dest" 2>/dev/null || true
              sudo cp -f "$PKG_REAL" "$dest/pkg-config" 2>/dev/null || true
            done
          fi

      - name: Setup musl cross-compiler wrappers (Linux only)
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          MUSL_PREFIX="${ARCH}-linux-musl"
          if ! command -v ${MUSL_PREFIX}-gcc &>/dev/null; then
            echo "Creating ${MUSL_PREFIX} toolchain wrappers..."
            sudo mkdir -p /usr/local/musl/bin /usr/local/musl/${MUSL_PREFIX}/bin
            for tool in gcc g++; do
              SRC=$(which musl-$tool 2>/dev/null || which musl-gcc 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
            for tool in ar ld nm objcopy objdump ranlib readelf strip; do
              SRC=$(which $tool 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
          fi

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run spc doctor (Unix, best-effort)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc doctor --auto-fix 2>&1 || echo "Doctor had issues (continuing)"

      - name: Run spc doctor (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php spc-src\bin\spc doctor --auto-fix 2>&1

      # ── Download sources ─────────────────────────────────
      # One unlucky fetch should not cost a platform. v0.0.4.26 lost its
      # release to a single failure downloading the musl toolchain.
      - name: Download PHP and extension sources (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHP_VER="${{ github.event.inputs.php_version || '8.3' }}"
          ./spc download \
            --for-extensions="${{ matrix.extensions }}" \
            --with-php=$PHP_VER

      - name: Download PHP and extension sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $phpVer = "${{ github.event.inputs.php_version || '8.3' }}"
          # Try with FFI first (needed for COW fork), fall back without it
          $exts = "${{ matrix.extensions }},ffi"
          php spc-src\bin\spc download --for-extensions="$exts" --with-php=$phpVer 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FFI download failed, building without it (will use php-cgi mode)"
            $exts = "${{ matrix.extensions }}"
            php spc-src\bin\spc download --for-extensions="$exts" --with-php=$phpVer
          }
          # One failed fetch should not cost the whole platform. v0.0.4.23 lost
          # its Windows binary to a single curl exit 22 on the icu archive,
          # which is reachable and was simply unlucky; the step below then
          # found no php.exe and skipped, and the job reported success.
          for ($try = 1; $try -le 3 -and $LASTEXITCODE -ne 0; $try++) {
            Write-Host "download failed, retry $try of 3 in 15s"
            Start-Sleep -Seconds 15
            php spc-src\bin\spc download --for-extensions="$exts" --with-php=$phpVer
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::spc download failed after 3 retries"
            exit 1
          }
          # Store which extensions we got
          Set-Content -Path "win_exts.txt" -Value $exts

      # ── Build ────────────────────────────────────────────
      - name: Build static PHP CLI + phpmicro (Unix)
        if: runner.os != 'Windows'
        env:
          SPC_SKIP_DOCTOR_CHECK_ITEMS: "pkg-config,musl-wrapper"
        run: |
          ./spc build "${{ matrix.extensions }}" --build-cli --build-micro --with-libs=libjpeg,libwebp,freetype

      - name: Build static PHP CLI + phpmicro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exts = Get-Content "win_exts.txt" -ErrorAction SilentlyContinue
          if (-not $exts) { $exts = "${{ matrix.extensions }}" }
          Write-Host "Building with extensions: $exts"
          php spc-src\bin\spc build "$exts" --build-cli --build-micro --with-libs=libjpeg,libwebp,freetype

      - name: Build qbix_fork.dll (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # cl.exe is on PATH from ilammy/msvc-dev-cmd
          Write-Host "Compiling qbix_fork.dll..."
          cl /LD /O2 src\fork_shim.c /Fe:qbix_fork.dll
          if (Test-Path qbix_fork.dll) {
            Write-Host "Built qbix_fork.dll: $((Get-Item qbix_fork.dll).Length) bytes"
          } else {
            Write-Host "qbix_fork.dll build failed (Windows COW fork unavailable, php-cgi fallback)"
          }

      # ── Package ──────────────────────────────────────────
      - name: Build phar and combine (Unix)
        if: runner.os != 'Windows'
        run: |
          ./buildroot/bin/php -d phar.readonly=0 build-phar.php
          ./spc micro:combine bin/qbixserver.phar -O qbixserver-${{ matrix.name }}
          chmod +x qbixserver-${{ matrix.name }}
          ls -lh qbixserver-${{ matrix.name }}
          cp buildroot/bin/php php-${{ matrix.name }}
          chmod +x php-${{ matrix.name }}

      - name: Build phar and combine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "spc-src\buildroot\bin\php.exe")) {
            Write-Host "PHP build did not produce a binary — skipping package step"
            exit 0
          }
          .\spc-src\buildroot\bin\php.exe -d phar.readonly=0 build-phar.php
          php spc-src\bin\spc micro:combine bin\qbixserver.phar -O qbixserver-${{ matrix.name }}.exe
          Get-Item qbixserver-${{ matrix.name }}.exe | Select-Object Name, Length
          Copy-Item spc-src\buildroot\bin\php.exe php-${{ matrix.name }}.exe
          if (Test-Path qbix_fork.dll) {
            Write-Host "Including qbix_fork.dll in artifacts"
          }

      - name: Build GUI variant (Windows, no console)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "qbixserver-${{ matrix.name }}.exe")) { exit 0 }
          Copy-Item "qbixserver-${{ matrix.name }}.exe" "qbixserver-${{ matrix.name }}-gui.exe"
          editbin /SUBSYSTEM:WINDOWS "qbixserver-${{ matrix.name }}-gui.exe"
          Write-Host "Built GUI variant (no console window on launch)"

      # ── Compress ─────────────────────────────────────────
      # NOTE: Do NOT UPX-pack the combined binary. `spc micro:combine`
      # appends the phar as an ELF overlay which phpmicro locates by
      # reading its own file at runtime; UPX rewrites the ELF and drops
      # that overlay, so the binary starts and tries to parse its own
      # compressed image as PHP (syntax error, unexpected token "!").

      # ── Smoke test ───────────────────────────────────────
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          out=$(./qbixserver-${{ matrix.name }} --help 2>&1)
          echo "$out" | head -5
          case "$out" in
            *"Parse error"*|*"Fatal error"*) echo "::error::binary is corrupt"; exit 1 ;;
          esac

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "qbixserver-${{ matrix.name }}.exe") {
            .\qbixserver-${{ matrix.name }}.exe --help 2>&1 | Select-Object -First 5
          } else {
            Write-Host "Binary not built — skipping smoke test"
          }

      # Runs against the built binary on purpose: the notices this catches
      # only appear when the server runs from the phar, so the same check
      # in the test workflow, which runs from source, would pass blind.
      - name: Response bodies carry no diagnostics (Unix)
        if: runner.os != 'Windows'
        run: QB=./qbixserver-${{ matrix.name }} bash tests/clean-body.sh

      # ── Upload ───────────────────────────────────────────
      # The steps above can each be made to fail properly, and still the thing
      # that matters is whether a binary exists. v0.0.4.23 shipped a lone DLL
      # because the build quietly produced nothing and every check was about a
      # step rather than an output. This one is about the output.
      - name: Check the build actually produced a server
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            want="qbixserver-${{ matrix.name }}.exe"
          else
            want="qbixserver-${{ matrix.name }}"
          fi
          if [ ! -s "$want" ]; then
            echo "::error::no server binary at $want - the build produced nothing"
            echo "what is here:"
            ls -la | sed 's/^/  /'
            exit 1
          fi
          echo "  $want  $(wc -c < "$want") bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbixserver-${{ matrix.name }}
          path: |
            qbixserver-${{ matrix.name }}*
            php-${{ matrix.name }}*
            qbix_fork.dll

  release:
    needs: [build, phar-is-current]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # Every release carried RELEASE_NOTES.md, a file describing v1.5.0. So
      # each one announced the same changes regardless of what was in it, and
      # the history read as a list of version numbers attached to somebody
      # else's release notes. The tag's own annotation is written per release
      # and says what changed, so that is what the release should show.
      - name: Take the release notes from the tag
        run: |
          git fetch --force --tags --depth=1
          tag='${{ github.ref_name }}'
          if [ -n "$(git tag -l --format='%(contents)' "$tag" | tr -d '[:space:]')" ]; then
            git tag -l --format='%(contents)' "$tag" > tag-notes.md
          else
            echo "No annotation on $tag." > tag-notes.md
            cat RELEASE_NOTES.md >> tag-notes.md
          fi
          # The first line is the summary; the rest is the body.
          head -1 tag-notes.md > tag-title.txt
          tail -n +2 tag-notes.md > tag-body.md
          echo "RELEASE_TITLE=$(cat tag-title.txt)" >> "$GITHUB_ENV"
          echo "--- title ---"; cat tag-title.txt
          echo "--- body ---";  head -20 tag-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          body_path: tag-body.md
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            bin/qbixserver.phar
            artifacts/qbixserver-linux-x86_64/qbixserver-linux-x86_64
            artifacts/qbixserver-linux-aarch64/qbixserver-linux-aarch64
            artifacts/qbixserver-macos-arm64/qbixserver-macos-arm64
            artifacts/qbixserver-macos-arm64/php-macos-arm64
            artifacts/qbixserver-windows-x64/qbixserver-windows-x64.exe
            artifacts/qbixserver-windows-x64/qbixserver-windows-x64-gui.exe
            artifacts/qbixserver-windows-x64/qbix_fork.dll
            artifacts/qbixserver-linux-x86_64/php-linux-x86_64
            artifacts/qbixserver-linux-aarch64/php-linux-aarch64
            artifacts/qbixserver-windows-x64/php-windows-x64.exe
